<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thumbloop</title>
<style>
:root{
  --bg:#14111f; --panel:#1d1830; --line:#352c52; --text:#e8e2ff; --dim:#8f85b3;
  --accent:#b794ff; --rec:#ff5d7a; --font:"FantasqueSansM Nerd Font","Fantasque Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:15px/1.4 var(--font)}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%;gap:8px;padding:10px 16px}
header{display:flex;flex-wrap:nowrap;align-items:center;gap:6px;white-space:nowrap}
header button,header input{padding:4px 9px}
header button,header label{flex:none}
header .sp{flex:1;min-width:0}
#tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
#tools .lbl{color:var(--dim)}
#tools small{color:var(--dim);font-size:12px}
#bottom{display:flex;gap:8px;min-height:0}
#bottom .lane{flex:1;min-width:0}
.panel{width:430px;flex:none;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:6px 10px;display:flex;flex-direction:column;gap:5px}
.panel .plabel{color:var(--text);font-weight:bold}
.panel small{color:var(--dim);font-weight:normal;font-size:11px;margin-left:8px;white-space:nowrap}
.panel .plabel{white-space:nowrap}
#slots{display:flex;gap:6px}
#slots button{padding:2px 10px;line-height:1.3}
button.slot{padding:3px 10px;min-width:34px}
button.slot.full{border-color:var(--accent);color:var(--accent)}
button.slot.cur{background:var(--accent);color:#14111f}
button:disabled{opacity:.4;cursor:default}
button,input{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 12px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);color:#14111f;border-color:var(--accent)}
button.rec.armed{border-color:var(--rec);color:var(--rec)}
button.rec.on{background:var(--rec);border-color:var(--rec);color:#14111f}
input[type=number]{width:70px}
label{color:var(--dim);display:flex;align-items:center;gap:6px}
#status{color:var(--dim);min-width:0;overflow:hidden;text-overflow:ellipsis}
#pad{color:var(--accent)}
#lanes{display:grid;grid-template-rows:repeat(4,1fr) 64px;gap:8px;min-height:0}
.lane{user-select:none;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden;cursor:pointer;min-height:0}
.lane.sel{border-color:var(--lc);box-shadow:0 0 0 1px var(--lc)}
.lane canvas{position:absolute;inset:0;width:100%;height:100%}
.lane .tag{position:absolute;left:10px;top:6px;color:var(--lc);font-weight:bold;pointer-events:none;text-shadow:0 0 4px var(--bg)}
.lane .tag small{color:var(--dim);font-weight:normal;margin-left:8px}
footer{color:var(--dim);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 18px}
footer b{color:var(--text);font-weight:normal;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 5px}
#songsModal{position:fixed;inset:0;background:rgba(10,8,20,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:6}
#songsModal.show{display:flex}
#songsModal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px}
#songsModal .srow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#songsModal .sp{flex:1}
#songsModal small{color:var(--dim)}
#songList{display:flex;flex-direction:column;gap:4px;overflow:auto;max-height:52vh}
.item{display:flex;gap:10px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
.item.cur{border-color:var(--accent)}
.item.sel{background:rgba(183,148,255,.18)}
.item .nm{flex:1;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{color:var(--dim);font-size:12px;white-space:nowrap}
.item button{padding:2px 9px;font-size:13px}
.item input{flex:1;min-width:0}
#saved{color:var(--dim);font-size:12px}
select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
#modal{position:fixed;inset:0;background:rgba(10,8,20,.8);display:none;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;width:min(900px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px}
#modal textarea{width:100%;height:min(46vh,360px);resize:none;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:13px/1.5 var(--font)}
#modal .row{display:flex;gap:8px;flex-wrap:wrap}
a.btn{color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 12px;text-decoration:none}
a.btn:hover{border-color:var(--accent)}
#lock{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--accent);color:#14111f;padding:14px 22px;border-radius:12px;font-size:18px;display:none;z-index:9;pointer-events:none;box-shadow:0 10px 36px rgba(0,0,0,.55);text-align:center}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--accent);color:#14111f;padding:6px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#app>*{min-width:0}
@media (max-width:1560px){header{flex-wrap:wrap}}   /* too narrow for one line: let the top bar wrap */
@media (max-width:640px){#app{padding:8px 12px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="bSongs"></button><span id="saved"></span>
    <button id="bPlay">&#9654; Play</button>
    <button id="bRec" class="rec">&#9679; Rec</button>
    <label>BPM <input id="bpm" type="number" min="60" max="220"></label>
    <button id="bBars"></button>
    <button id="bMetro">Metronome</button>
    <button id="bScope"></button>
    <button id="bUndo">&#8630; Undo</button>
    <button id="bSound"></button>
    <button id="bAudio">&#9210; Record audio</button>
    <button id="bClear">Clear lane</button>
    <button id="bClearAll">Clear all</button>
    <span id="status"></span><span id="pad"></span>
    <span class="sp"></span>
    <button id="bExport">Export to Strudel</button>
  </header>
  <div id="lanes"></div>
  <footer id="help"></footer>
</div>
<div id="songsModal"><div class="box">
  <div class="srow"><b>Songs</b><span class="sp"></span><select id="newSet"></select><button id="sNew">+ New song</button><button id="sSave">Save backup file</button><button id="sOpen">Open file</button><button id="sClose">Close</button></div>
  <div id="songList"></div>
  <small>&uarr;&darr; pick · Enter open · R rename · D duplicate · Del delete · N new · Ctrl+S backup file · Esc close</small>
  <input type="file" id="sFile" accept=".json,application/json" hidden>
</div></div>
<div id="modal"><div class="box">
  <div>Strudel code &mdash; paste it into strudel.cc, or open it directly. The .mid file has one track per lane.</div>
  <textarea id="code" readonly></textarea>
  <div class="row"><button id="bCopy">Copy</button><a id="bOpen" class="btn" target="_blank" rel="noopener">Open in Strudel</a><a id="bMid" class="btn">Download .mid</a><button id="bClose">Close</button></div>
</div></div>
<div id="lock">Click anywhere or press a key<br>to turn the sound on</div>
<div id="toast"></div>

<script src="drums.js"></script>
<script src="config.js"></script>
<script src="audio.js"></script>
<script src="songs.js"></script>
<script src="play.js"></script>
<script src="input.js"></script>
<script src="export.js"></script>
<script>
"use strict";
// ---------- state ----------
const state = {sound:"nes", armed:false, song:[], sec:0, songMode:"off", playSec:-1, cur:0, clips:Array(CLIP_SLOTS).fill(null),
               ch:0, strip:false, oct:CHANNELS.map(()=>0), vol:CHANNELS.map(()=>1), bpm:120, bars:2, metro:true, rec:false,
               seq:CHANNELS.map(()=>Array(MAX_STEPS).fill(null))};
let ready = false, saveFailed = false;
let lanesEl = null;                          // the lanes container, once the UI is built (applySound rebuilds the lanes when the lane count changes)
const cv = [];                               // per lane: {el, canvas, tag}
// ---------- load the saved songs ----------
try { const j = JSON.parse(localStorage.getItem(LIB_KEY)||"null");
      if (j && j.songs){ Object.values(j.songs).map(sanitizeSong).filter(Boolean).forEach(r => { lib.songs[r.id] = r; }); lib.current = j.current;
                         if (Array.isArray(j.clips) && j.clips.length===CLIP_SLOTS) lib.clips = j.clips; } } catch(e){}
if (!Object.keys(lib.songs).length) try { const o = JSON.parse(localStorage.getItem(OLD_KEY)||"null");
      if (o){ const r = sanitizeSong(legacySong(o)); if (r){ lib.songs[r.id] = r; lib.current = r.id; } if (Array.isArray(o.clips) && o.clips.length===CLIP_SLOTS) lib.clips = o.clips; } } catch(e){}
if (!Object.keys(lib.songs).length){ const r = newSong("Untitled 1", "nes"); lib.songs[r.id] = r; lib.current = r.id; }
if (!lib.songs[lib.current]) lib.current = Object.values(lib.songs).sort((a, b) => b.updated-a.updated)[0].id;
adoptSong(lib.songs[lib.current]);
let inputMode = "kb";                        // "kb" | "pad": which device was used last (drives the on-screen help)
function setInput(m){ if (m==="kb" && state.strip){ state.strip = false; refresh(); }
  if (m!==inputMode){ inputMode = m; renderHelp(); refresh(); } }
// the audio module needs the state above, so the first sound-set setup happens here
applySound();
CHANNELS.forEach((_, ci) => applyVol(ci));

// ---------- start up ----------
state.sec = Math.min(state.sec, state.song.length-1); loadSection(state.sec); ready = true;

// ---------- export window ----------
const $ = id => document.getElementById(id);
function openModal(){
  const code = toStrudel(); $("code").value = code;
  $("bOpen").href = "https://strudel.cc/#"+encodeURIComponent(btoa(unescape(encodeURIComponent(code))));
  URL.revokeObjectURL($("bMid").href);
  $("bMid").href = URL.createObjectURL(new Blob([toMidi()], {type:"audio/midi"}));
  $("bMid").download = (state.name.replace(/[^\w .,'-]/g, "").trim() || "thumbloop")+".mid";
  $("modal").classList.add("show");
}
function closeModal(){ $("modal").classList.remove("show"); }
$("bCopy").onclick = async () => {
  try { await navigator.clipboard.writeText($("code").value); }
  catch(e){ $("code").select(); document.execCommand("copy"); }
  toast("copied");
};
$("bClose").onclick = closeModal; $("bExport").onclick = openModal;
let toastT; function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1800); }

// ---------- UI ----------
lanesEl = $("lanes");
const bottomEl = document.createElement("div"); bottomEl.id = "bottom"; lanesEl.appendChild(bottomEl);
function buildLaneEls(){                                              // one element per lane, sized to the current sound set
  lanesEl.querySelectorAll(":scope > .lane").forEach(el => el.remove());
  cv.length = 0;
  CHANNELS.forEach((c, ci) => {
    const d = document.createElement("div"); d.className = "lane"; d.style.setProperty("--lc", c.color);
    d.innerHTML = '<canvas></canvas><div class="tag"></div>'; d.onclick = () => actions.lane(ci);
    const barAt = ev => Math.max(0, Math.min(state.bars-1, Math.floor((ev.clientX - d.getBoundingClientRect().left) / d.clientWidth * state.bars)));
    d.onpointerdown = ev => { if (ev.button!==0) return; const b = barAt(ev), all = ev.shiftKey;
      sel = {l0:all ? 0 : ci, l1:all ? CHANNELS.length-1 : ci, a:b, b};
      const move = e2 => { sel.b = barAt(e2); }, up = () => { removeEventListener("pointermove", move); removeEventListener("pointerup", up); };
      addEventListener("pointermove", move); addEventListener("pointerup", up); };
    lanesEl.insertBefore(d, bottomEl); cv.push({el:d, canvas:d.firstChild, tag:d.lastChild});
  });
  lanesEl.style.gridTemplateRows = "repeat("+CHANNELS.length+",1fr) 64px";
}
buildLaneEls();
const BIN_W = 64, TRASH_W = 2*BIN_W;                                  // the duplicate zone and the bin at the far end of the sections strip
const chipLayout = (n, w) => { const cw = Math.max(48, Math.min(96, (w-20-TRASH_W-6*(n-1))/n)); return {cw, off:Math.max(0, 10+(state.sec+1)*(cw+6)-(w-TRASH_W))}; };    // scrolls so the selected chip stays in view
const chipItems = () => [...state.song.map((sec, i) => ({sec, i})), {plus:true}];       // one chip per section, then a + chip
const songEl = document.createElement("div"); songEl.className = "lane"; songEl.style.setProperty("--lc", "#9aa7ff");
songEl.innerHTML = '<canvas></canvas><div class="tag"></div>'; bottomEl.appendChild(songEl);
const clipsEl = document.createElement("div"); clipsEl.className = "panel"; bottomEl.appendChild(clipsEl);
clipsEl.innerHTML = '<div class="plabel" title="click an empty slot: save this lane. click a full slot: load it onto this lane. shift-click: overwrite. right-click: empty it">Clips<small>click: save / load \u00b7 shift: overwrite \u00b7 right-click: empty</small></div><div id="slots"></div>';
let drag = null;                                                      // dragging a section chip: {from, startX, x, moved, over}  (over = a slot index, or "bin")
const chipAt = (x, L) => Math.floor((x - 10 + L.off) / (L.cw+6));
const stripX = ev => ev.clientX - songEl.getBoundingClientRect().left;
songEl.onpointerdown = ev => {
  const n = state.song.length, L = chipLayout(n+1, songEl.clientWidth), x = stripX(ev), i = chipAt(x, L);
  if (i<0 || i>n) return;
  if (i===n) return actions.secNew();                                 // the + chip
  actions.secGo(i); drag = {from:i, startX:x, x, moved:false, over:i}; try { songEl.setPointerCapture(ev.pointerId); } catch(e){}
};
songEl.onpointermove = ev => {
  if (!drag) return;
  const n = state.song.length, w = songEl.clientWidth, L = chipLayout(n+1, w), x = stripX(ev);
  drag.x = x; drag.moved = drag.moved || Math.abs(x-drag.startX) > 6;
  drag.over = x > w-BIN_W ? "bin" : x > w-TRASH_W ? "dup" : Math.max(0, Math.min(n-1, chipAt(x, L)));
};
songEl.onpointerup = () => { const d = drag; drag = null; if (!d || !d.moved) return; if (d.over==="bin") actions.secDel(); else if (d.over==="dup") actions.secDup(d.from); else actions.secMove(d.from, d.over); };
songEl.onpointercancel = () => { drag = null; };
function noteLabel(ci, e){          // the key (or pad button) that plays this entry in the current octave; an arrow if it is in another octave
  if (e.drum) return inputMode==="pad" ? padDrumBtn[e.drum] : DRUMS.find(d => d.id===e.drum).key.toUpperCase();
  const d = e.note - CHANNELS[ci].base - state.oct[ci]*12;                      // semitones above the lane's current octave
  if (inputMode==="pad") return padNoteBtn[d] || NOTE_NAMES[((e.note%12)+12)%12].toUpperCase();
  if (pianoKey[d]) return pianoKey[d];
  return pianoKey[((d%12)+12)%12] + (d<0 ? "\u2193" : "\u2191");
}
function laneHint(ci){
  const c = CHANNELS[ci], v = "vol "+Math.round(state.vol[ci]*100)+"%  ";
  return v + (c.kind==="noise" ? DRUMS.map(d=>d.key.toUpperCase()+"="+d.label).join("  ")
                          : "octave "+(state.oct[ci]>=0?"+":"")+state.oct[ci]);
}
function refresh(){
  songEl.classList.toggle("sel", state.strip);
  cv.forEach((l, ci) => { l.el.classList.toggle("sel", !state.strip && ci===state.ch);
    l.tag.innerHTML = (ci+1)+" "+CHANNELS[ci].name+"<small>"+laneHint(ci)+"</small>"; });
  songEl.lastChild.innerHTML = "Sections<small>section "+(state.sec+1)+" of "+state.song.length+" \u00b7 hearing: "+MODE_LABEL[state.songMode]+" \u00b7 drag to reorder \u00b7 drop on the copy icon to duplicate \u00b7 on the bin to delete</small>";
  $("bPlay").innerHTML = T ? "&#9632; Stop" : "&#9654; Play"; $("bPlay").classList.toggle("on", !!T);
  $("bRec").classList.toggle("on", state.rec); $("bRec").classList.toggle("armed", state.armed); $("bMetro").classList.toggle("on", state.metro);
  $("bSongs").textContent = "\u266a "+state.name; $("bSongs").title = "Songs (Ctrl+O)";
  $("bUndo").disabled = !undoStack.length; $("bSound").textContent = "Sound: "+SOUNDS[state.sound].label;
  $("bAudio").classList.toggle("rec", !!audioRecorder); $("bAudio").classList.toggle("on", !!audioRecorder); $("bAudio").innerHTML = audioRecorder ? "&#9632; Stop audio" : "&#9210; Record audio";
  [...$("slots").children].forEach((b, i) => { b.classList.toggle("full", !!state.clips[i]); b.classList.toggle("cur", state.cur===i); b.title = slotText(i); });
  $("bScope").textContent = "Hear: "+MODE_LABEL[state.songMode];
  $("bpm").value = state.bpm; $("bBars").textContent = "Loop: "+state.bars+(state.bars===1?" bar":" bars");
}
$("bUndo").onclick = actions.undo; $("bSound").onclick = actions.sound; $("bAudio").onclick = actions.audioRec;
for (let i=0;i<CLIP_SLOTS;i++){ const b = document.createElement("button"); b.className = "slot"; b.textContent = i+1;
  b.onclick = ev => actions.clipSlot(i, ev); b.oncontextmenu = ev => { ev.preventDefault(); actions.clipClear(i); }; $("slots").appendChild(b); }
$("bPlay").onclick = actions.play; $("bRec").onclick = actions.rec;
$("bMetro").onclick = actions.metro; $("bScope").onclick = actions.scope; $("bBars").onclick = () => actions.bars(state.bars===8 ? -3 : 1); $("bClear").onclick = actions.clear;
$("bClearAll").onclick = () => { pushUndo(); setTrace(Object.fromEntries(state.seq.map((l, ci) => [ci, l.slice(0, STEPS)]))); state.seq.forEach(s=>s.fill(null)); save(); toast("all cleared"); };
$("bpm").onchange = e => { state.bpm = Math.max(60, Math.min(220, +e.target.value||120)); refresh(); save(); };
const keyName = k => ({" ":"Space", arrowleft:"\u2190", arrowright:"\u2192", delete:"Del"})[k] || k.toUpperCase();
const keyHelp = () => KEYMAP.map(r => "<span>"+r.keys.map((k, i) => "<b>"+(r.ctrl && !i ? "Ctrl+" : "")+keyName(k)+"</b>").join("/")+" "+r.label+"</span>").join("");
const helpLines = () => inputMode==="pad" ? [
  "<span><b>D-pad + X A B Y</b> play notes (pentatonic)</span>", chordHelp(),
  "<span>drums lane: <b>A</b> kick <b>X</b> snare <b>Y</b> hat <b>B</b> open hat \u00b7 D-pad <b>\u25b2</b> clap <b>\u25bc</b> rim <b>\u25c0</b> low tom <b>\u25b6</b> high tom</span>",
  ...PAD_STICK_HELP.map(t => "<span>"+t.replace(/^(\w+ stick)/, "<b>$1</b>")+"</span>"),
  PADMAP.map(r => "<span><b>"+PAD_BTN[r.btn]+"</b> "+r.label+"</span>").join("")]
: [
  "<span><b>1-"+CHANNELS.length+"</b> lane</span>",
  "<span><b>"+Object.keys(PIANO).map(k => k.toUpperCase()).join(" ")+"</b> piano (home row = white keys)</span>",
  "<span><b>"+DRUMS.map(d => d.key.toUpperCase()).join(" ")+"</b> drums on the drum lane</span>", chordHelp(),
  keyHelp()+"<span>drag over bars to select (<b>Shift</b> = every lane) \u00b7 <b>Backspace</b> clear them</span>"];
const chordHelp = () => {
  const set = SOUNDS[state.sound].chords, pad = inputMode==="pad", a = pad ? "RT" : keyName(chordKeyFor("rt")), b = pad ? "LT" : keyName(chordKeyFor("lt"));
  return "<span>hold <b>"+a+"</b> "+set.rt.name+" \u00b7 <b>"+b+"</b> "+set.lt.name+" \u00b7 both = "+set.both.name+(set.block ? " (block chords)" : " (arpeggio)")+"</span>";
};
function renderHelp(){ $("help").innerHTML = helpLines().join(""); }

// ---------- songs panel ----------
const slug = n => cleanName(n).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "song";
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const songsUI = {open:false, idx:0, renaming:null, confirm:null};
const songList = () => Object.values(lib.songs).sort((a, b) => b.updated-a.updated);
const uniqueName = base => { const names = new Set(Object.values(lib.songs).map(r => r.name)); let n = base, k = 2; while (names.has(n)) n = base+" "+(k++); return n; };
function openSong(id, saveFirst=true){
  if (!lib.songs[id]) return; if (saveFirst) save(); if (T) stop();
  adoptSong(lib.songs[id]); applySound(); CHANNELS.forEach((_, ci) => applyVol(ci));
  undoStack.length = 0; loadSection(state.sec); lib.current = id; persist(); renderHelp(); refresh(); toast("opened \u201c"+state.name+"\u201d");
}
function addSong(r, thenOpen=true){ lib.songs[r.id] = r; persist(); if (thenOpen) openSong(r.id); }
function newSongNow(sound){ let k = 1; const names = new Set(Object.values(lib.songs).map(r => r.name)); while (names.has("Untitled "+k)) k++; addSong(newSong("Untitled "+k, sound)); }
function dupSong(id){ save(); const r = JSON.parse(JSON.stringify(lib.songs[id])); r.id = newId(); r.name = uniqueName(r.name+" copy"); r.updated = Date.now(); addSong(r, false); songsUI.idx = songList().findIndex(x => x.id===r.id); renderSongs(); }
function delSong(id){
  const wasCurrent = id===state.id; delete lib.songs[id]; songsUI.confirm = null;
  if (!Object.keys(lib.songs).length){ const r = newSong("Untitled 1", "nes"); lib.songs[r.id] = r; }
  if (wasCurrent) openSong(songList()[0].id, false); else persist();
  songsUI.idx = Math.max(0, Math.min(songsUI.idx, songList().length-1)); renderSongs();
}
function renameSong(id, name){
  name = cleanName(name); songsUI.renaming = null; if (name && lib.songs[id]){ lib.songs[id].name = name; if (id===state.id) state.name = name; persist(); refresh(); } renderSongs();
}
function backupSong(){
  save(); const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify({thumbloop:1, song:songRec()}, null, 1)], {type:"application/json"}));
  a.download = "thumbloop-"+slug(state.name)+".json"; a.click(); toast("saved "+a.download+" to Downloads");
}
async function importSong(file){
  try {
    const r = sanitizeSong(JSON.parse(await file.text()).song);
    if (!r) return toast("that file isn't a Thumbloop song");
    r.id = newId(); r.name = uniqueName(r.name); r.updated = Date.now();
    addSong(r); closeSongs();
  } catch(e){ toast("couldn't read that file"); }
}
function renderSongs(){
  const list = songList(), when = t => { const d = new Date(t); return d.toLocaleDateString(undefined, {month:"short", day:"numeric"})+" "+d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}); };
  $("songList").innerHTML = list.map((r, i) => '<div class="item'+(r.id===state.id ? " cur" : "")+(i===songsUI.idx ? " sel" : "")+'" data-id="'+r.id+'">'
    + (songsUI.renaming===r.id ? '<input value="'+esc(r.name)+'" maxlength="60">' : '<span class="nm">'+esc(r.name)+(r.id===state.id ? ' <small>(open)</small>' : '')+'</span>')
    + '<span class="meta">'+SOUNDS[r.sound].label+' \u00b7 '+r.song.length+' section'+(r.song.length>1 ? "s" : "")+' \u00b7 '+when(r.updated)+'</span>'
    + '<button data-act="rename">Rename</button><button data-act="dup">Duplicate</button><button data-act="del">'+(songsUI.confirm===r.id ? "Sure?" : "Delete")+'</button></div>').join("");
  const inp = $("songList").querySelector("input");
  if (inp){ inp.focus(); inp.select(); inp.onkeydown = e => { e.stopPropagation(); if (e.key==="Enter") renameSong(songsUI.renaming, inp.value); else if (e.key==="Escape"){ songsUI.renaming = null; renderSongs(); } }; inp.onblur = () => { if (songsUI.renaming) renameSong(songsUI.renaming, inp.value); }; }
}
function openSongs(){ save(); songsUI.open = true; songsUI.renaming = songsUI.confirm = null; songsUI.idx = Math.max(0, songList().findIndex(r => r.id===state.id)); renderSongs(); $("songsModal").classList.add("show"); }
function closeSongs(){ songsUI.open = false; songsUI.renaming = songsUI.confirm = null; $("songsModal").classList.remove("show"); }
function songsKey(e){
  if (e.target.matches("input,textarea,select")) return;
  const list = songList(), cur = list[songsUI.idx], k = e.key.toLowerCase(); let used = true;
  if ((e.ctrlKey||e.metaKey) && k==="s") backupSong();
  else if (e.ctrlKey||e.metaKey||e.altKey) used = false;
  else if (k==="escape") closeSongs();
  else if (k==="arrowdown" || k==="arrowup"){ songsUI.idx = (songsUI.idx+(k==="arrowdown" ? 1 : -1)+list.length)%list.length; songsUI.confirm = null; renderSongs(); }
  else if (k==="enter" && cur){ openSong(cur.id); closeSongs(); }
  else if (k==="r" && cur){ songsUI.renaming = cur.id; renderSongs(); }
  else if (k==="d" && cur) dupSong(cur.id);
  else if ((k==="delete" || k==="backspace") && cur){ if (songsUI.confirm===cur.id) delSong(cur.id); else { songsUI.confirm = cur.id; renderSongs(); } }
  else if (k==="n"){ newSongNow($("newSet").value); closeSongs(); }
  else used = false;
  if (used) e.preventDefault();
}
$("newSet").innerHTML = Object.entries(SOUNDS).map(([k, v]) => '<option value="'+k+'">'+esc(v.label)+'</option>').join("");
$("bSongs").onclick = openSongs; $("sClose").onclick = closeSongs; $("sSave").onclick = backupSong;
$("sNew").onclick = () => { newSongNow($("newSet").value); closeSongs(); };
$("sOpen").onclick = () => $("sFile").click(); $("sFile").onchange = e => { if (e.target.files[0]) importSong(e.target.files[0]); e.target.value = ""; };
$("songsModal").onclick = e => { if (e.target===$("songsModal")) closeSongs(); };
$("songList").onclick = e => {
  const row = e.target.closest(".item"); if (!row) return; const id = row.dataset.id, act = e.target.dataset.act;
  songsUI.idx = songList().findIndex(r => r.id===id);
  if (act==="rename"){ songsUI.renaming = id; songsUI.confirm = null; renderSongs(); }
  else if (act==="dup") dupSong(id);
  else if (act==="del"){ if (songsUI.confirm===id) delSong(id); else { songsUI.confirm = id; renderSongs(); } }
  else if (e.target.classList.contains("nm") || e.target===row){ openSong(id); closeSongs(); }
};

// ---------- draw ----------
function draw(){
  pollPad();
  const pos = position(), rel = pos===null ? null : pos - T.countin, relD = rel===null ? null : rel - T.lead;   // relD: steps into your new section
  if (T && T.mode==="all" && rel!==null && rel>=0 && relD<0){               // song up to here: watch the earlier sections go by on the lanes
    const it = T.tl.items.find(x => rel >= x.start && rel < x.start+x.len);
    if (it){ T.followed = true; if (it.idx!==state.sec) actions.secGo(it.idx); }
  }
  let head = relD!==null && relD>=0 && T.mode!=="play" ? Math.floor(relD)%STEPS : -1;
  if (T && T.mode==="play" && rel!==null && rel>=0){                        // whole song: the lanes stay on your section; the strip shows what plays
    const at = rel % T.tl.total, it = T.tl.items.find(x => at >= x.start && at < x.start+x.len);
    if (it && it.idx===state.sec) head = Math.floor(at - it.start) % STEPS;
  }
  cv.forEach((l, ci) => {
    const cvs = l.canvas, dpr = devicePixelRatio||1, w = l.el.clientWidth, h = l.el.clientHeight;
    if (cvs.width!==w*dpr || cvs.height!==h*dpr){ cvs.width = w*dpr; cvs.height = h*dpr; }
    const g = cvs.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
    const col = CHANNELS[ci].color, stripH = 20, mid = (h-stripH)/2+4;
    // step strip along the bottom
    const cw = w/STEPS, sy = h-stripH-3, ghost = state.song[state.sec-1];
    for (let i=0;i<STEPS;i++){
      g.fillStyle = i%BAR===0 ? "rgba(255,255,255,.22)" : i%4===0 ? "rgba(255,255,255,.12)" : "rgba(255,255,255,.05)";
      g.fillRect(i*cw+1, sy, cw-2, stripH);
      const gsrc = trace && trace[ci] ? trace[ci] : ghost && ghost.lanes[ci];                       // dim ghost: what you just deleted, else the previous section, so you can line things up
      const ge = gsrc && gsrc[i];                                   // (no wrap: a shorter previous section isn't repeated under a longer one)
      const e = state.seq[ci][i];
      if (ge){ const gl = entriesAt(ge), gh = stripH/gl.length;
        gl.forEach((x, j) => { g.fillStyle = col; g.globalAlpha=.4; g.fillRect(i*cw+1, sy+j*gh, cw*(x.len||1)-2, gh-(j<gl.length-1?1:0)); g.globalAlpha=1; });
        const gt = gl.slice(0, 3).map(x => noteLabel(ci, x)).join("+"); g.font = "bold 10px monospace";
        if (!e && g.measureText(gt).width+6 <= cw*(ge.len||1)){ g.fillStyle = "rgba(255,255,255,.85)"; g.textBaseline = "middle"; g.fillText(gt, i*cw+4, sy+stripH/2); } }
      if (e){ const list = entriesAt(e), sh = stripH/list.length;       // several notes at one step are drawn as stacked slices
              list.forEach((x, j) => { g.fillStyle = col; g.globalAlpha=.9; g.fillRect(i*cw+1, sy+j*sh, cw*(x.len||1)-2, sh-(j<list.length-1?1:0)); g.globalAlpha=1;
                if (x.chord){ g.fillStyle = "#fff"; g.fillRect(i*cw+1, sy+j*sh, cw*(x.len||1)-2, Math.min(3, sh)); } });
              const label = list.slice(0, 3).map(x => noteLabel(ci, x)).join("+"); g.font = "bold 10px monospace";
              if (g.measureText(label).width+6 <= cw*(e.len||1)){ g.fillStyle = "#14111f"; g.textBaseline = "middle"; g.fillText(label, i*cw+4, sy+stripH/2+(e.chord?1.5:0)); } }
      if (i===head){ g.strokeStyle="#fff"; g.lineWidth=2; g.strokeRect(i*cw+1, sy, cw-2, stripH); }
    }
    const r = selBars();
    if (r && ci>=r.l0 && ci<=r.l1){ g.fillStyle = "rgba(255,255,255,.1)"; g.fillRect(r.a*BAR*cw, 0, (r.b-r.a+1)*BAR*cw, h); g.strokeStyle = "rgba(255,255,255,.7)"; g.lineWidth = 1.5; g.strokeRect(r.a*BAR*cw+1, 1, (r.b-r.a+1)*BAR*cw-2, h-2); }
    // scope: start on a rising zero crossing so the wave holds still
    const an = chan[ci].an, buf = chan[ci].buf; an.getFloatTimeDomainData(buf);
    let s0 = 0; for (let i=0;i<buf.length/2;i++) if (buf[i]<=0 && buf[i+1]>0){ s0=i; break; }
    const n = 700; g.strokeStyle = col; g.lineWidth = 2; g.beginPath();
    const amp = (h-stripH-14)/2/.35;
    for (let i=0;i<n;i++){ const x = i/(n-1)*w, y = mid - Math.max(-.45,Math.min(.45,buf[s0+i]))*amp*.98; i?g.lineTo(x,y):g.moveTo(x,y); }
    g.stroke();
  });
  { // sections strip: one chip per section, a + chip, and the bin
    const c5 = songEl.firstChild, dpr = devicePixelRatio||1, w = songEl.clientWidth, h = songEl.clientHeight;
    if (c5.width!==w*dpr || c5.height!==h*dpr){ c5.width = w*dpr; c5.height = h*dpr; }
    const g = c5.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
    const items = chipItems(), n = items.length, letters = sectionLetters(), L = chipLayout(n, w), cw = L.cw, y = 24, chH = h-y-8, moving = drag && drag.moved;
    const chip = (item, x, ghost) => {
      if (item.plus){ g.strokeStyle = "rgba(255,255,255,.3)"; g.setLineDash([4,3]); g.strokeRect(x, y, cw, chH); g.setLineDash([]);
                      g.fillStyle = "rgba(232,226,255,.7)"; g.textBaseline = "middle"; g.font = "bold 20px monospace"; g.fillText("+", x+cw/2-6, y+chH/2); return; }
      const sec = item.sec, picked = state.sec===item.i, playing = !ghost && !!T && (state.playSec>=0 ? state.playSec===item.i : picked && state.songMode!=="play");
      g.globalAlpha = ghost ? .8 : moving && drag.from===item.i ? .3 : 1;
      g.fillStyle = playing ? "rgba(154,167,255,.45)" : "rgba(255,255,255,.07)"; g.fillRect(x, y, cw, chH);
      g.strokeStyle = playing ? "#fff" : picked ? "#b794ff" : "rgba(255,255,255,.18)"; g.lineWidth = playing||picked ? 2 : 1; g.strokeRect(x, y, cw, chH);
      g.fillStyle = "#e8e2ff"; g.textBaseline = "middle"; g.font = "bold 15px monospace"; g.fillText((item.i+1)+letters[item.i], x+8, y+chH/2);
      g.font = "11px monospace"; g.fillStyle = "rgba(232,226,255,.6)"; g.fillText(sec.bars+"b", x+40, y+chH/2);
      CHANNELS.forEach((c, ci) => { g.fillStyle = sec.lanes[ci].slice(0, sec.bars*BAR).some(Boolean) ? c.color : "rgba(255,255,255,.12)"; g.fillRect(x+cw-8-(CHANNELS.length-ci)*8, y+chH/2-3, 6, 6); });
      g.globalAlpha = 1;
    };
    items.forEach((item, k) => chip(item, 10 + k*(cw+6) - L.off, false));
    if (moving && typeof drag.over==="number"){ const mx = 10 + (drag.over + (drag.over>drag.from ? 1 : 0))*(cw+6) - L.off - 3; g.fillStyle = "#b794ff"; g.fillRect(mx, y-4, 3, chH+8); }
    if (moving) chip(items[drag.from], drag.x - cw/2, true);
    const dx = w-TRASH_W+6, dhot = moving && drag.over==="dup";                                  // the duplicate zone
    g.strokeStyle = dhot ? "#7dffb0" : "rgba(255,255,255,.35)"; g.fillStyle = dhot ? "rgba(125,255,176,.22)" : "rgba(255,255,255,.05)"; g.lineWidth = 2;
    g.fillRect(dx, y, BIN_W-16, chH); g.strokeRect(dx, y, BIN_W-16, chH);
    { const cx = dx+(BIN_W-16)/2, cy = y+chH/2; g.strokeRect(cx-10, cy-9, 12, 14); g.strokeRect(cx-3, cy-3, 12, 14); }
    const bx = w-BIN_W+6, hot = moving && drag.over==="bin";                                  // the bin
    g.strokeStyle = hot ? "#ff5d7a" : "rgba(255,255,255,.35)"; g.fillStyle = hot ? "rgba(255,93,122,.25)" : "rgba(255,255,255,.05)"; g.lineWidth = 2;
    g.fillRect(bx, y, BIN_W-16, chH); g.strokeRect(bx, y, BIN_W-16, chH);
    const cx = bx+(BIN_W-16)/2, cy = y+chH/2; g.beginPath(); g.moveTo(cx-9, cy-4); g.lineTo(cx-7, cy+10); g.lineTo(cx+7, cy+10); g.lineTo(cx+9, cy-4); g.moveTo(cx-11, cy-6); g.lineTo(cx+11, cy-6); g.moveTo(cx-3, cy-9); g.lineTo(cx+3, cy-9); g.stroke();
  }
  let st = "";
  if (ctx.state!=="running") st = "click page / press a key for sound";
  else if (T && rel<0) st = "count-in "+(Math.floor((pos)/4)+1)+"/4";
  else if (T && T.mode==="play"){ const it = T.tl.items.find(x => rel % T.tl.total >= x.start && rel % T.tl.total < x.start+x.len) || T.tl.items[0];
    st = "♪ section "+(it.idx+1)+"/"+state.song.length+" ("+sectionLetters()[it.idx]+")"; }
  else if (T && relD<0){ const it = T.tl.items.find(x => rel >= x.start && rel < x.start+x.len) || T.tl.items[0];
    st = "♪ lead-in: section "+(it.idx+1)+" ("+sectionLetters()[it.idx]+")"; }
  else if (T) st = (state.rec?"● REC ":state.armed?"○ armed · ":"▶ ")+"section "+(state.sec+1)+" · bar "+(Math.floor(relD/BAR)%state.bars+1)+"/"+state.bars;
  if (audioRecorder && ctx.state==="running") st = "⏺ audio recording · "+st;
  if ($("status").textContent!==st) $("status").textContent = st;
  $("lock").style.display = ctx.state==="running" ? "none" : "block";
  requestAnimationFrame(draw);
}
renderHelp(); refresh(); requestAnimationFrame(draw);
</script>
