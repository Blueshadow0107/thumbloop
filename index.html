<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thumbloop</title>
<style>
:root{
  --bg:#14111f; --panel:#1d1830; --line:#352c52; --text:#e8e2ff; --dim:#8f85b3;
  --accent:#b794ff; --rec:#ff5d7a; --font:"FantasqueSansM Nerd Font","Fantasque Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:15px/1.4 var(--font)}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%;gap:8px;padding:10px 16px}
header{display:flex;flex-wrap:nowrap;align-items:center;gap:6px;white-space:nowrap}
header button,header input{padding:4px 9px}
header button,header label{flex:none}
header .sp{flex:1;min-width:0}
#tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
#tools .lbl{color:var(--dim)}
#tools small{color:var(--dim);font-size:12px}
#bottom{display:flex;gap:8px;min-height:0}
#bottom .lane{flex:1;min-width:0}
.panel{width:430px;flex:none;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:6px 10px;display:flex;flex-direction:column;gap:5px}
.panel .plabel{color:var(--text);font-weight:bold}
.panel small{color:var(--dim);font-weight:normal;font-size:11px;margin-left:8px;white-space:nowrap}
.panel .plabel{white-space:nowrap}
#slots{display:flex;gap:6px}
#slots button{padding:2px 10px;line-height:1.3}
button.slot{padding:3px 10px;min-width:34px}
button.slot.full{border-color:var(--accent);color:var(--accent)}
button.slot.cur{background:var(--accent);color:#14111f}
button:disabled{opacity:.4;cursor:default}
button,input{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 12px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);color:#14111f;border-color:var(--accent)}
button.rec.armed{border-color:var(--rec);color:var(--rec)}
button.rec.on{background:var(--rec);border-color:var(--rec);color:#14111f}
input[type=number]{width:70px}
label{color:var(--dim);display:flex;align-items:center;gap:6px}
#status{color:var(--dim);min-width:0;overflow:hidden;text-overflow:ellipsis}
#pad{color:var(--accent)}
#lanes{display:grid;grid-template-rows:repeat(4,1fr) 64px;gap:8px;min-height:0}
.lane{user-select:none;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden;cursor:pointer;min-height:0}
.lane.sel{border-color:var(--lc);box-shadow:0 0 0 1px var(--lc)}
.lane canvas{position:absolute;inset:0;width:100%;height:100%}
.lane .tag{position:absolute;left:10px;top:6px;color:var(--lc);font-weight:bold;pointer-events:none;text-shadow:0 0 4px var(--bg)}
.lane .tag small{color:var(--dim);font-weight:normal;margin-left:8px}
footer{color:var(--dim);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 18px}
footer b{color:var(--text);font-weight:normal;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 5px}
#songsModal{position:fixed;inset:0;background:rgba(10,8,20,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:6}
#songsModal.show{display:flex}
#songsModal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px}
#songsModal .srow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#songsModal .sp{flex:1}
#songsModal small{color:var(--dim)}
#songList{display:flex;flex-direction:column;gap:4px;overflow:auto;max-height:52vh}
.item{display:flex;gap:10px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
.item.cur{border-color:var(--accent)}
.item.sel{background:rgba(183,148,255,.18)}
.item .nm{flex:1;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{color:var(--dim);font-size:12px;white-space:nowrap}
.item button{padding:2px 9px;font-size:13px}
.item input{flex:1;min-width:0}
#saved{color:var(--dim);font-size:12px}
select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
#modal{position:fixed;inset:0;background:rgba(10,8,20,.8);display:none;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;width:min(900px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px}
#modal textarea{width:100%;height:min(46vh,360px);resize:none;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:13px/1.5 var(--font)}
#modal .row{display:flex;gap:8px;flex-wrap:wrap}
a.btn{color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 12px;text-decoration:none}
a.btn:hover{border-color:var(--accent)}
#lock{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--accent);color:#14111f;padding:14px 22px;border-radius:12px;font-size:18px;display:none;z-index:9;pointer-events:none;box-shadow:0 10px 36px rgba(0,0,0,.55);text-align:center}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--accent);color:#14111f;padding:6px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#app>*{min-width:0}
@media (max-width:1560px){header{flex-wrap:wrap}}   /* too narrow for one line: let the top bar wrap */
@media (max-width:640px){#app{padding:8px 12px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="bSongs"></button><span id="saved"></span>
    <button id="bPlay">&#9654; Play</button>
    <button id="bRec" class="rec">&#9679; Rec</button>
    <label>BPM <input id="bpm" type="number" min="60" max="220"></label>
    <button id="bBars"></button>
    <button id="bMetro">Metronome</button>
    <button id="bScope"></button>
    <button id="bUndo">&#8630; Undo</button>
    <button id="bSound"></button>
    <button id="bAudio">&#9210; Record audio</button>
    <button id="bClear">Clear lane</button>
    <button id="bClearAll">Clear all</button>
    <span id="status"></span><span id="pad"></span>
    <span class="sp"></span>
    <button id="bExport">Export to Strudel</button>
  </header>
  <div id="lanes"></div>
  <footer id="help"></footer>
</div>
<div id="songsModal"><div class="box">
  <div class="srow"><b>Songs</b><span class="sp"></span><select id="newSet"></select><button id="sNew">+ New song</button><button id="sSave">Save backup file</button><button id="sOpen">Open file</button><button id="sClose">Close</button></div>
  <div id="songList"></div>
  <small>&uarr;&darr; pick · Enter open · R rename · D duplicate · Del delete · N new · Ctrl+S backup file · Esc close</small>
  <input type="file" id="sFile" accept=".json,application/json" hidden>
</div></div>
<div id="modal"><div class="box">
  <div>Strudel code &mdash; paste it into strudel.cc, or open it directly.</div>
  <textarea id="code" readonly></textarea>
  <div class="row"><button id="bCopy">Copy</button><a id="bOpen" class="btn" target="_blank" rel="noopener">Open in Strudel</a><button id="bClose">Close</button></div>
</div></div>
<div id="lock">Click anywhere or press a key<br>to turn the sound on</div>
<div id="toast"></div>

<script src="drums.js"></script>
<script src="config.js"></script>
<script>
"use strict";
// ---------- state ----------
const state = {sound:"nes", armed:false, song:[], sec:0, songMode:"off", playSec:-1, cur:0, clips:Array(CLIP_SLOTS).fill(null),
               ch:0, strip:false, oct:CHANNELS.map(()=>0), vol:CHANNELS.map(()=>1), bpm:120, bars:2, metro:true, rec:false,
               seq:CHANNELS.map(()=>Array(MAX_STEPS).fill(null))};
let ready = false, saveFailed = false;
let lanesEl = null;                          // the lanes container, once the UI is built (applySound rebuilds the lanes when the lane count changes)
const cv = [];                               // per lane: {el, canvas, tag}
// ---------- songs: a library of named songs in localStorage ----------
const LIB_KEY = "thumbloop", OLD_KEY = "nes-keys";            // OLD_KEY: the single unnamed save from before songs had names
const lib = {current:null, songs:{}, clips:Array(CLIP_SLOTS).fill(null)};     // clips are shared by every song
const laneCount = sound => SOUNDS[sound].lanes.length;
const blankSection = (sound, bars=2) => ({bars, lanes:Array.from({length:laneCount(sound)}, () => Array(bars*BAR).fill(null))});
const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2, 6);
const cleanName = n => String(n||"").replace(/\s+/g, " ").trim().slice(0, 60);
const newSong = (name, sound) => ({id:newId(), name, sound, bpm:SOUNDS[sound].bpm, vol:SOUNDS[sound].lanes.map(l => l.vol ?? 1), song:[blankSection(sound)], sec:0, songMode:"off", updated:Date.now()});
const validSong = r => !!(r && SOUNDS[r.sound] && Array.isArray(r.song) && r.song.length && r.song.every(x => x && BAR_OPTIONS.includes(x.bars) && Array.isArray(x.lanes) && x.lanes.length===laneCount(r.sound)));
const clampInt = (v, lo, hi, d) => Number.isFinite(+v) ? Math.max(lo, Math.min(hi, Math.round(+v))) : d;
function cleanEntry(e, noise){                                   // rebuild an entry from typed fields only: songs from files end up inside generated Strudel code
  if (!e || typeof e!=="object") return null;
  let out = null;
  if (noise){ if (DRUMS.some(d => d.id===e.drum)) out = {drum:e.drum}; }
  else if (Number.isInteger(e.note) && e.note>=0 && e.note<=127){
    out = {note:e.note, len:clampInt(e.len, 1, MAX_STEPS, 1)};
    if (Array.isArray(e.chord)){ const iv = e.chord.slice(0, 6).filter(x => Number.isInteger(x) && x>=-24 && x<=48); if (iv.length){ out.chord = iv; if (e.block) out.block = true; } }
  }
  if (out && Array.isArray(e.more)){ const m = e.more.slice(0, 8).map(x => cleanEntry(x, noise)).filter(Boolean); if (m.length) out.more = m; }
  return out;
}
function sanitizeSong(r){                                         // a stored or imported song, or null when it can't be used
  if (!validSong(r)) return null;
  const n = laneCount(r.sound), lanesDef = SOUNDS[r.sound].lanes;
  return {id:/^[a-z0-9]{4,24}$/.test(r.id) ? r.id : newId(), name:cleanName(r.name) || "Untitled", sound:r.sound,
    bpm:clampInt(r.bpm, 60, 220, SOUNDS[r.sound].bpm),
    vol:Array.from({length:n}, (_, i) => Number.isFinite(+(r.vol||[])[i]) ? Math.max(0, Math.min(VOL_MAX, +r.vol[i])) : 1),
    song:r.song.map(sec => ({bars:sec.bars, lanes:sec.lanes.map((l, ci) => Array.from({length:sec.bars*BAR}, (_, k) => cleanEntry(Array.isArray(l) ? l[k] : null, lanesDef[ci].kind==="noise")))})),
    sec:clampInt(r.sec, 0, r.song.length-1, 0), songMode:MODES.includes(r.songMode) ? r.songMode : "off", updated:Number.isFinite(+r.updated) ? +r.updated : Date.now()};
}
function legacySong(o){                                          // the old single save becomes a song: its sections, plus the loop you were working on
  const sound = SOUNDS[o.sound] ? o.sound : "nes", n = laneCount(sound), bars = BAR_OPTIONS.includes(o.bars) ? o.bars : 2;
  const song = (Array.isArray(o.song) ? o.song : []).filter(x => x && BAR_OPTIONS.includes(x.bars) && Array.isArray(x.lanes) && x.lanes.length===n);
  if (Array.isArray(o.seq) && o.seq.length===n){
    const cur = {bars, lanes:o.seq.map(l => Array.from({length:bars*BAR}, (_, k) => (l && l[k]) || null))}, last = song[song.length-1];
    if (!last || (cur.lanes.some(l => l.some(Boolean)) && JSON.stringify(last.lanes)!==JSON.stringify(cur.lanes))) song.push(cur);
  }
  if (!song.length) song.push(blankSection(sound));
  return {id:newId(), name:"Untitled 1", sound, bpm:o.bpm||SOUNDS[sound].bpm, vol:Array.isArray(o.vol) && o.vol.length===n ? o.vol : Array(n).fill(1), song, sec:song.length-1, songMode:MODES.includes(o.songMode) ? o.songMode : "off", updated:Date.now()};
}
try { const j = JSON.parse(localStorage.getItem(LIB_KEY)||"null");
      if (j && j.songs){ Object.values(j.songs).map(sanitizeSong).filter(Boolean).forEach(r => { lib.songs[r.id] = r; }); lib.current = j.current;
                         if (Array.isArray(j.clips) && j.clips.length===CLIP_SLOTS) lib.clips = j.clips; } } catch(e){}
if (!Object.keys(lib.songs).length) try { const o = JSON.parse(localStorage.getItem(OLD_KEY)||"null");
      if (o){ const r = sanitizeSong(legacySong(o)); if (r){ lib.songs[r.id] = r; lib.current = r.id; } if (Array.isArray(o.clips) && o.clips.length===CLIP_SLOTS) lib.clips = o.clips; } } catch(e){}
if (!Object.keys(lib.songs).length){ const r = newSong("Untitled 1", "nes"); lib.songs[r.id] = r; lib.current = r.id; }
if (!lib.songs[lib.current]) lib.current = Object.values(lib.songs).sort((a, b) => b.updated-a.updated)[0].id;
function adoptSong(r){                                           // make a stored song the live one (no audio work here)
  state.id = r.id; state.name = r.name; state.sound = r.sound; state.bpm = r.bpm || SOUNDS[r.sound].bpm;
  state.vol = r.vol.slice(); state.song = JSON.parse(JSON.stringify(r.song)); state.sec = Math.max(0, Math.min(state.song.length-1, r.sec|0));
  state.songMode = MODES.includes(r.songMode) ? r.songMode : "off"; state.clips = lib.clips;
}
adoptSong(lib.songs[lib.current]);
const songRec = () => ({id:state.id, name:state.name, sound:state.sound, bpm:state.bpm, vol:state.vol, song:state.song, sec:state.sec, songMode:state.songMode, updated:Date.now()});
function persist(){
  lib.clips = state.clips;
  try { localStorage.setItem(LIB_KEY, JSON.stringify(lib)); saveFailed = false; const el = document.getElementById("saved"); if (el) el.textContent = "saved \u2713"; }
  catch(e){ if (!saveFailed) toast("couldn't save: browser storage is full or blocked. Ctrl+S keeps a backup file."); saveFailed = true; }
}
const save = () => { commit(); lib.songs[state.id] = songRec(); lib.current = state.id; persist(); };
const stepDur = () => 60/state.bpm/4;
let inputMode = "kb";                        // "kb" | "pad": which device was used last (drives the on-screen help)
function setInput(m){ if (m==="kb" && state.strip){ state.strip = false; refresh(); }
  if (m!==inputMode){ inputMode = m; renderHelp(); refresh(); } }

// ---------- audio ----------
const ctx = new (window.AudioContext||window.webkitAudioContext)();
const master = ctx.createGain(); master.gain.value = .6;
const limiter = ctx.createDynamicsCompressor();                   // a kick, bass and chords landing together used to add up past full scale and distort; this holds the peaks down
limiter.threshold.value = -10; limiter.knee.value = 8; limiter.ratio.value = 12; limiter.attack.value = .003; limiter.release.value = .15;
master.connect(limiter); limiter.connect(ctx.destination);
const recDest = ctx.createMediaStreamDestination(); limiter.connect(recDest); let audioRecorder = null;   // tap for "Record audio"
const makeChan = () => {
  const gain = ctx.createGain(), an = ctx.createAnalyser(); an.fftSize = 2048;
  gain.connect(an); gain.connect(master);
  return {gain, an, buf:new Float32Array(an.fftSize)};
};
const chan = CHANNELS.map(makeChan);
const applyVol = ci => chan[ci].gain.gain.setTargetAtTime(state.vol[ci], ctx.currentTime, .01);
let waves;
const buildWaves = () => CHANNELS.map(c => {   // band-limited pulse wave at the given duty
  if (c.kind!=="pulse") return null;
  const N = 64, re = new Float32Array(N), im = new Float32Array(N);
  for (let n=1;n<N;n++){ const k=2/(n*Math.PI); re[n]=k*Math.sin(n*Math.PI*c.duty); im[n]=k*(1-Math.cos(n*Math.PI*c.duty)); }
  return ctx.createPeriodicWave(re, im);
});
function applySound(){                         // swap every lane over to the active sound set (the set may have a different number of lanes)
  const lanes = SOUNDS[state.sound].lanes, n = lanes.length;
  while (CHANNELS.length < n) CHANNELS.push({});
  CHANNELS.length = n;
  CHANNELS.forEach((c, i) => { Object.keys(c).forEach(k => delete c[k]); Object.assign(c, lanes[i]); });
  while (chan.length < n) chan.push(makeChan());
  state.oct = Array.from({length:n}, (_, i) => state.oct[i] || 0);
  if (state.vol.length!==n) state.vol = lanes.map(l => l.vol ?? 1);
  while (state.seq.length < n) state.seq.push(Array(MAX_STEPS).fill(null));
  state.seq.length = n; state.ch = Math.min(state.ch, n-1);
  waves = buildWaves();
  if (lanesEl) buildLaneEls();
}
applySound();
CHANNELS.forEach((_, ci) => applyVol(ci));
const noiseBuf = (() => { const b = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), d = b.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1; return b; })();

function startRhodes(ci, midi, when){         // FM electric piano: soft tine attack, mellow decay, slow tremolo
  const c = CHANNELS[ci], f = 440*2**((midi-69)/12);
  const car = ctx.createOscillator(), mod = ctx.createOscillator(), modG = ctx.createGain(), bell = ctx.createOscillator(), bellG = ctx.createGain();
  car.frequency.value = f; mod.frequency.value = f; bell.frequency.value = f*14;
  modG.gain.setValueAtTime(f*1.4, when); modG.gain.exponentialRampToValueAtTime(f*.12, when+.9);       // brightness fades as it rings
  bellG.gain.setValueAtTime(f*.45, when); bellG.gain.exponentialRampToValueAtTime(.01, when+.1);       // the "tine" at the start
  mod.connect(modG).connect(car.frequency); bell.connect(bellG).connect(car.frequency);
  const g = ctx.createGain(); g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(c.level, when+.006);
  g.gain.exponentialRampToValueAtTime(c.level*.35, when+.7); g.gain.setTargetAtTime(c.level*.1, when+.7, 1.4);
  const tg = ctx.createGain(); tg.gain.value = .9;
  const trem = ctx.createOscillator(), tremAmt = ctx.createGain(); trem.frequency.value = 4.6; tremAmt.gain.value = .1; trem.connect(tremAmt).connect(tg.gain);
  const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = Math.min(5000, f*7);
  car.connect(g).connect(tg).connect(lp).connect(chan[ci].gain);
  [car, mod, bell, trem].forEach(o => o.start(when));
  return { stop(t){ g.gain.cancelScheduledValues(t); g.gain.setTargetAtTime(0, t, .14); [car, mod, bell, trem].forEach(o => o.stop(t+1)); } };
}
function startBass(ci, midi, when){             // warm sine bass with a hint of triangle, rolled off up top
  const c = CHANNELS[ci], f = 440*2**((midi-69)/12), a = ctx.createOscillator(), b = ctx.createOscillator(), bg = ctx.createGain(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
  a.frequency.value = f; b.type = "triangle"; b.frequency.value = f; bg.gain.value = .25; lp.type = "lowpass"; lp.frequency.value = 520;
  g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(c.level, when+.012); g.gain.setTargetAtTime(c.level*.7, when+.012, .25);
  a.connect(g); b.connect(bg).connect(g); g.connect(lp).connect(chan[ci].gain); a.start(when); b.start(when);
  return { stop(t){ g.gain.cancelScheduledValues(t); g.gain.setTargetAtTime(0, t, .08); a.stop(t+.6); b.stop(t+.6); } };
}
function startSynth(ci, midi, when){            // configurable synth: a few oscillators through a lowpass and an envelope (settings in the lane's `synth`)
  const c = CHANNELS[ci], p = c.synth, f = 440*2**((midi-69)/12), env = p.env, total = p.osc.reduce((t, o) => t+(o.gain ?? 1), 0);
  const g = ctx.createGain(), lp = ctx.createBiquadFilter(), oscs = [];
  lp.type = "lowpass"; lp.frequency.value = Math.min(p.lp || 18000, f*40); lp.Q.value = p.q || .7;
  g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(c.level, when+env.a); g.gain.setTargetAtTime(c.level*env.s, when+env.a, env.d/3);
  p.osc.forEach(o => {
    const x = ctx.createOscillator(), og = ctx.createGain(); x.type = o.type; x.frequency.value = f*(o.ratio || 1); x.detune.value = o.detune || 0;
    og.gain.value = (o.gain ?? 1)/total; if (o.decay) og.gain.setTargetAtTime(0, when+.002, o.decay);       // a partial that fades (bell overtones)
    x.connect(og).connect(g); x.start(when); oscs.push(x);
  });
  g.connect(lp).connect(chan[ci].gain);
  return { stop(t){
    g.gain.cancelScheduledValues(t);                                                  // (this also drops the fade-in, so a note released early would stay silent)
    if (t < when+env.a) g.gain.linearRampToValueAtTime(c.level*Math.max(0, t-when)/env.a, t);   // rebuild the fade-in up to the release point
    g.gain.setTargetAtTime(0, t, env.r/3); oscs.forEach(x => x.stop(t+env.r+.1)); } };
}
function startVoice(ci, midi, when, chord, dur=Infinity, block=false){
  if (chord && block){ const vs = chord.map(i => startVoice(ci, midi+i, when, null, dur)); return { stop(t){ vs.forEach(v => v.stop(t)); } }; }
  return (VOICES[CHANNELS[ci].kind] || startChip)(ci, midi, when, chord, dur);
}
function startChip(ci, midi, when, chord, dur){   // NES-style voice: pulse or triangle, chords as fast arpeggios
  const c = CHANNELS[ci], o = ctx.createOscillator(), g = ctx.createGain();
  const freqs = (chord || [0]).map(i => 440*2**((midi+i-69)/12));
  o.frequency.value = freqs[0];
  if (c.kind==="pulse") o.setPeriodicWave(waves[ci]); else o.type = "triangle";
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(c.level, when+c.env.a);
  g.gain.setTargetAtTime(c.level*c.env.s, when+c.env.a, c.env.d/3);
  o.connect(g).connect(chan[ci].gain); o.start(when);
  let stopAt = Infinity, tNext = when, k = 0;

function noteLayers(seq, steps){           // split a lane into single-voice layers: a note goes on the first layer that is free when it starts
  const layers = [], ends = [];
  for (let i=0;i<steps;i++) entriesAt(seq[i]).forEach(n => {
    let k = ends.findIndex(end => end <= i);
    if (k<0){ k = layers.length; layers.push(Array(steps).fill(null)); ends.push(0); }
    layers[k][i] = n; ends[k] = i + (n.drum ? 1 : Math.max(1, n.len || 1));
  });
  return layers;
}
function stepTokens(seq, steps){           // one token per 16th step: note / [chord] / drum / ~ rest / _ held
  const out = Array(steps).fill("~");
  const starts = seq.slice(0, steps).map((e,i)=>e?i:-1).filter(i=>i>=0);
  starts.forEach((i, j) => {
    const e = seq[i];
    if (e.drum){ out[i] = e.drum; return; }
    const next = j+1<starts.length ? starts[j+1] : steps;
    const len = Math.max(1, Math.min(e.len, next-i));
    const nm = m => NOTE_NAMES[m%12] + (Math.floor(m/12)-1);
    out[i] = !e.chord ? nm(e.note) : e.block ? "["+e.chord.map(x => nm(e.note+x)).join(",")+"]"
           : "["+e.chord.map(x => nm(e.note+x)).join(" ")+"]*"+(+(stepDur()*ARP_HZ/e.chord.length*len).toFixed(2));
    for (let k=1;k<len;k++) out[i+k] = "_";
  });
  return out;
}
function laneCode(ci, seq, bars){          // one lane's patterns plus its sound (stacked when notes overlap), or null when it is silent
  const layers = noteLayers(seq, bars*BAR); if (!layers.length) return null;
  const c = CHANNELS[ci], pg = state.vol[ci]!==1 ? ".postgain("+state.vol[ci]+")" : "";
  const codes = layers.map(layer => {
    const t = stepTokens(layer, bars*BAR), groups = Array.from({length:bars}, (_, b) => t.slice(b*BAR, (b+1)*BAR).join(" "));
    const pat = groups.every(g => g===groups[0]) ? "["+groups[0]+"]" : "<"+groups.map(g => "["+g+"]").join(" ")+">";
    return (c.kind==="noise" ? "s" : "note")+'("'+pat+'")'+c.strudel+pg;
  });
  return codes.length>1 ? "stack(\n    "+codes.join(",\n    ")+"\n  )" : codes[0];
}
function toStrudel(){
  commit();
  const lines = ["// "+state.name.replace(/[^\w .,'-]/g, "")+" \u00b7 made in Thumbloop", "setcps("+state.bpm+"/60/4)", ""];
  if (state.song.length>1){                // the whole song: each distinct section once, then arranged in order
    const letters = sectionLetters(), done = new Set();
    state.song.forEach((sec, i) => {
      if (done.has(letters[i])) return; done.add(letters[i]);
      const lanes = CHANNELS.map((c, ci) => laneCode(ci, sec.lanes[ci], sec.bars)).filter(Boolean);
      lines.push("// section "+letters[i]+" ("+sec.bars+(sec.bars===1?" bar":" bars")+")",
                 "const sec"+letters[i]+" = "+(lanes.length ? "stack(\n  "+lanes.join(",\n  ")+"\n)" : "silence"), "");
    });
    lines.push("// the song, in order", "$: arrange("+state.song.map((sec, i) => "["+sec.bars+", sec"+letters[i]+"]").join(", ")+")");
    return lines.join("\n");
  }
  CHANNELS.forEach((c, ci) => {            // no song yet: export the loop you are working on
    const code = laneCode(ci, state.seq[ci], state.bars); if (!code) return;
    lines.push("// "+c.name, "$: "+code+"._scope()", "");

}

  cv.forEach((l, ci) => {
    const cvs = l.canvas, dpr = devicePixelRatio||1, w = l.el.clientWidth, h = l.el.clientHeight;
    if (cvs.width!==w*dpr || cvs.height!==h*dpr){ cvs.width = w*dpr; cvs.height = h*dpr; }
    const g = cvs.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
    const col = CHANNELS[ci].color, stripH = 20, mid = (h-stripH)/2+4;
    // step strip along the bottom
    const cw = w/STEPS, sy = h-stripH-3, ghost = state.song[state.sec-1];
    for (let i=0;i<STEPS;i++){
      g.fillStyle = i%BAR===0 ? "rgba(255,255,255,.22)" : i%4===0 ? "rgba(255,255,255,.12)" : "rgba(255,255,255,.05)";
      g.fillRect(i*cw+1, sy, cw-2, stripH);
      const gsrc = trace && trace[ci] ? trace[ci] : ghost && ghost.lanes[ci];                       // dim ghost: what you just deleted, else the previous section, so you can line things up
      const ge = gsrc && gsrc[i % gsrc.length];
      const e = state.seq[ci][i];
      if (ge){ const gl = entriesAt(ge), gh = stripH/gl.length;
        gl.forEach((x, j) => { g.fillStyle = col; g.globalAlpha=.4; g.fillRect(i*cw+1, sy+j*gh, cw*(x.len||1)-2, gh-(j<gl.length-1?1:0)); g.globalAlpha=1; });
        const gt = gl.slice(0, 3).map(x => noteLabel(ci, x)).join("+"); g.font = "bold 10px monospace";
        if (!e && g.measureText(gt).width+6 <= cw*(ge.len||1)){ g.fillStyle = "rgba(255,255,255,.85)"; g.textBaseline = "middle"; g.fillText(gt, i*cw+4, sy+stripH/2); } }
      if (e){ const list = entriesAt(e), sh = stripH/list.length;       // several notes at one step are drawn as stacked slices
              list.forEach((x, j) => { g.fillStyle = col; g.globalAlpha=.9; g.fillRect(i*cw+1, sy+j*sh, cw*(x.len||1)-2, sh-(j<list.length-1?1:0)); g.globalAlpha=1;
                if (x.chord){ g.fillStyle = "#fff"; g.fillRect(i*cw+1, sy+j*sh, cw*(x.len||1)-2, Math.min(3, sh)); } });
              const label = list.slice(0, 3).map(x => noteLabel(ci, x)).join("+"); g.font = "bold 10px monospace";
              if (g.measureText(label).width+6 <= cw*(e.len||1)){ g.fillStyle = "#14111f"; g.textBaseline = "middle"; g.fillText(label, i*cw+4, sy+stripH/2+(e.chord?1.5:0)); } }
      if (i===head){ g.strokeStyle="#fff"; g.lineWidth=2; g.strokeRect(i*cw+1, sy, cw-2, stripH); }
    }
    const r = selBars();
    if (r && ci>=r.l0 && ci<=r.l1){ g.fillStyle = "rgba(255,255,255,.1)"; g.fillRect(r.a*BAR*cw, 0, (r.b-r.a+1)*BAR*cw, h); g.strokeStyle = "rgba(255,255,255,.7)"; g.lineWidth = 1.5; g.strokeRect(r.a*BAR*cw+1, 1, (r.b-r.a+1)*BAR*cw-2, h-2); }
    // scope: start on a rising zero crossing so the wave holds still
    const an = chan[ci].an, buf = chan[ci].buf; an.getFloatTimeDomainData(buf);
    let s0 = 0; for (let i=0;i<buf.length/2;i++) if (buf[i]<=0 && buf[i+1]>0){ s0=i; break; }
    const n = 700; g.strokeStyle = col; g.lineWidth = 2; g.beginPath();
    const amp = (h-stripH-14)/2/.35;
    for (let i=0;i<n;i++){ const x = i/(n-1)*w, y = mid - Math.max(-.45,Math.min(.45,buf[s0+i]))*amp*.98; i?g.lineTo(x,y):g.moveTo(x,y); }
    g.stroke();
  });
  { // sections strip: one chip per section, a + chip, and the bin
    const c5 = songEl.firstChild, dpr = devicePixelRatio||1, w = songEl.clientWidth, h = songEl.clientHeight;
    if (c5.width!==w*dpr || c5.height!==h*dpr){ c5.width = w*dpr; c5.height = h*dpr; }
    const g = c5.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
    const items = chipItems(), n = items.length, letters = sectionLetters(), L = chipLayout(n, w), cw = L.cw, y = 24, chH = h-y-8, moving = drag && drag.moved;
    const chip = (item, x, ghost) => {
      if (item.plus){ g.strokeStyle = "rgba(255,255,255,.3)"; g.setLineDash([4,3]); g.strokeRect(x, y, cw, chH); g.setLineDash([]);
                      g.fillStyle = "rgba(232,226,255,.7)"; g.textBaseline = "middle"; g.font = "bold 20px monospace"; g.fillText("+", x+cw/2-6, y+chH/2); return; }
      const sec = item.sec, picked = state.sec===item.i, playing = !ghost && !!T && (state.playSec>=0 ? state.playSec===item.i : picked && state.songMode!=="play");
      g.globalAlpha = ghost ? .8 : moving && drag.from===item.i ? .3 : 1;
      g.fillStyle = playing ? "rgba(154,167,255,.45)" : "rgba(255,255,255,.07)"; g.fillRect(x, y, cw, chH);
      g.strokeStyle = playing ? "#fff" : picked ? "#b794ff" : "rgba(255,255,255,.18)"; g.lineWidth = playing||picked ? 2 : 1; g.strokeRect(x, y, cw, chH);
      g.fillStyle = "#e8e2ff"; g.textBaseline = "middle"; g.font = "bold 15px monospace"; g.fillText((item.i+1)+letters[item.i], x+8, y+chH/2);
      g.font = "11px monospace"; g.fillStyle = "rgba(232,226,255,.6)"; g.fillText(sec.bars+"b", x+40, y+chH/2);
      CHANNELS.forEach((c, ci) => { g.fillStyle = sec.lanes[ci].slice(0, sec.bars*BAR).some(Boolean) ? c.color : "rgba(255,255,255,.12)"; g.fillRect(x+cw-8-(CHANNELS.length-ci)*8, y+chH/2-3, 6, 6); });
      g.globalAlpha = 1;
    };
    items.forEach((item, k) => chip(item, 10 + k*(cw+6) - L.off, false));
    if (moving && drag.over!=="bin"){ const mx = 10 + (drag.over + (drag.over>drag.from ? 1 : 0))*(cw+6) - L.off - 3; g.fillStyle = "#b794ff"; g.fillRect(mx, y-4, 3, chH+8); }
    if (moving) chip(items[drag.from], drag.x - cw/2, true);
    const bx = w-TRASH_W+6, hot = moving && drag.over==="bin";                                  // the bin
    g.strokeStyle = hot ? "#ff5d7a" : "rgba(255,255,255,.35)"; g.fillStyle = hot ? "rgba(255,93,122,.25)" : "rgba(255,255,255,.05)"; g.lineWidth = 2;
    g.fillRect(bx, y, TRASH_W-16, chH); g.strokeRect(bx, y, TRASH_W-16, chH);
    const cx = bx+(TRASH_W-16)/2, cy = y+chH/2; g.beginPath(); g.moveTo(cx-9, cy-4); g.lineTo(cx-7, cy+10); g.lineTo(cx+7, cy+10); g.lineTo(cx+9, cy-4); g.moveTo(cx-11, cy-6); g.lineTo(cx+11, cy-6); g.moveTo(cx-3, cy-9); g.lineTo(cx+3, cy-9); g.stroke();
  }
  let st = "";
  if (ctx.state!=="running") st = "click page / press a key for sound";
  else if (T && rel<0) st = "count-in "+(Math.floor((pos)/4)+1)+"/4";
  else if (T && T.mode==="play"){ const it = T.tl.items.find(x => rel % T.tl.total >= x.start && rel % T.tl.total < x.start+x.len) || T.tl.items[0];
    st = "♪ section "+(it.idx+1)+"/"+state.song.length+" ("+sectionLetters()[it.idx]+")"; }
  else if (T && relD<0){ const it = T.tl.items.find(x => rel >= x.start && rel < x.start+x.len) || T.tl.items[0];
    st = "♪ lead-in: section "+(it.idx+1)+" ("+sectionLetters()[it.idx]+")"; }
  else if (T) st = (state.rec?"● REC ":state.armed?"○ armed · ":"▶ ")+"section "+(state.sec+1)+" · bar "+(Math.floor(relD/BAR)%state.bars+1)+"/"+state.bars;
  if (audioRecorder && ctx.state==="running") st = "⏺ audio recording · "+st;
  if ($("status").textContent!==st) $("status").textContent = st;
  $("lock").style.display = ctx.state==="running" ? "none" : "block";
  requestAnimationFrame(draw);
}
renderHelp(); refresh(); requestAnimationFrame(draw);
</script>
